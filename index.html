<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Attendance System</title>
    <!-- Modern Typography: Inter, Outfit, and Kantumruy Pro for Khmer Language -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader" style="position:fixed;inset:0;background:#0B132B;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;z-index:99999;color:#F8FAFC;">
        <div style="position:relative;width:64px;height:64px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border:3px solid rgba(16,185,129,0.15);border-top:3px solid #10B981;border-radius:50%;animation:preloader-spin 1s linear infinite;"></div>
          <div style="width:24px;height:24px;background:rgba(16,185,129,0.2);border-radius:50%;box-shadow:0 0 16px rgba(16,185,129,0.6);"></div>
        </div>
        <div style="font-size:14px;font-weight:700;letter-spacing:0.18em;color:#10B981;text-transform:uppercase;margin-bottom:6px;">Smart Attendance System</div>
        <div style="font-size:12px;color:#94A3B8;letter-spacing:0.05em;">Initializing AI Engine...</div>
        <style>
          @keyframes preloader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

  
</html>
